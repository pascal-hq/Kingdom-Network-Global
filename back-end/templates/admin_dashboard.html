<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kingdom Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0A1128;
            color: #F4F6F9;
        }
        /* Header */
        .header {
            background: rgba(10,17,40,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(201,160,61,0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { color: #C9A03D; font-size: 1.3rem; }
        .header-actions { display: flex; gap: 1rem; align-items: center; }
        .role-badge {
            background: rgba(201,160,61,0.2);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: #C9A03D;
        }
        .logout-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(201,160,61,0.3);
            padding: 0.4rem 1rem;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s;
        }
        .logout-btn:hover { background: rgba(201,160,61,0.2); }
        /* Container */
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        /* Cards */
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(201,160,61,0.15);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .card-header h2 { color: #C9A03D; font-size: 1.2rem; }
        .btn-primary {
            background: linear-gradient(135deg, #C9A03D, #A8842A);
            color: #0A1128;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(201,160,61,0.3); }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(201,160,61,0.3);
            color: #C9A03D;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-secondary:hover { background: rgba(201,160,61,0.15); }
        .btn-upload {
            background: rgba(201,160,61,0.2);
            border: 1px solid rgba(201,160,61,0.3);
            color: #C9A03D;
            padding: 0.4rem 1rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }
        .btn-upload:hover { background: rgba(201,160,61,0.3); }
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
        /* Item Cards */
        .item-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.3s;
        }
        .item-card:hover { border-color: rgba(201,160,61,0.2); }
        .item-info h3 { font-size: 1rem; margin-bottom: 0.25rem; }
        .item-info p { font-size: 0.85rem; color: #94A3B8; }
        .item-actions { display: flex; gap: 0.5rem; }
        .item-actions button {
            background: none;
            border: none;
            padding: 0.3rem 0.6rem;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .btn-edit { color: #C9A03D; }
        .btn-edit:hover { background: rgba(201,160,61,0.15); }
        .btn-delete { color: #ef4444; }
        .btn-delete:hover { background: rgba(239,68,68,0.15); }
        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1B2A4A;
            border-radius: 24px;
            padding: 2rem;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-header h2 { color: #C9A03D; }
        .close-modal {
            background: none;
            border: none;
            color: #94A3B8;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .close-modal:hover { color: white; }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            color: #E2C275;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.7rem 1rem;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(201,160,61,0.3);
            border-radius: 12px;
            color: #F4F6F9;
            font-family: inherit;
            font-size: 0.95rem;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #C9A03D;
        }
        .form-group input[type="file"] {
            padding: 0.5rem;
            background: rgba(255,255,255,0.05);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .admin-badge {
            background: #C9A03D;
            color: #0A1128;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 12px;
            margin-left: 0.5rem;
        }
        .admin-section { border-color: rgba(201,160,61,0.4); }
        .loading { text-align: center; padding: 2rem; color: #94A3B8; }
        .preview-image {
            max-width: 150px;
            max-height: 100px;
            border-radius: 8px;
            margin-top: 0.5rem;
            border: 1px solid rgba(201,160,61,0.2);
        }
        .upload-row {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .header { padding: 0.75rem 1rem; flex-direction: column; gap: 0.5rem; }
            .container { padding: 1rem; }
            .upload-row { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Kingdom Network Global Admin</h1>
        <div class="header-actions">
            <span id="userRole" class="role-badge">Admin</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">

        <!-- Events Section -->
        <div class="card">
            <div class="card-header">
                <h2>Events</h2>
                <button class="btn-primary" onclick="openEventModal()">+ Add Event</button>
            </div>
            <div id="eventsList" class="grid">
                <div class="loading">Loading events...</div>
            </div>
        </div>

        <!-- Prayer Requests Section -->
        <div class="card">
            <div class="card-header">
                <h2>Prayer Requests</h2>
            </div>
            <div id="prayersList" class="grid">
                <div class="loading">Loading prayer requests...</div>
            </div>
        </div>

        <!-- Admin Only Section -->
        <div id="adminSection" class="card admin-section">
            <div class="card-header">
                <h2>Admin Settings <span class="admin-badge">Admin Only</span></h2>
            </div>
            <div style="display:flex;gap:1rem;flex-wrap:wrap;">
                <button class="btn-primary" onclick="openSettingsModal()">Edit Ministry Settings</button>
                <button class="btn-secondary" onclick="openDepartmentsModal()">Edit Departments</button>
            </div>
        </div>

    </div>

    <!-- Event Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="eventModalTitle">Add Event</h2>
                <button class="close-modal" onclick="closeModal('eventModal')">&times;</button>
            </div>
            <form id="eventForm" onsubmit="saveEvent(event)">
                <input type="hidden" id="eventId" value="">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="eventTitle" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="eventLocation" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="eventDescription" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Upload Poster</label>
                    <div class="upload-row">
                        <input type="file" id="eventPosterFile" accept="image/*">
                        <button type="button" class="btn-upload" onclick="uploadPoster()">Upload</button>
                    </div>
                    <input type="hidden" id="eventPosterUrl">
                    <div id="posterPreview"></div>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Save Event</button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Ministry Settings</h2>
                <button class="close-modal" onclick="closeModal('settingsModal')">&times;</button>
            </div>
            <form id="settingsForm" onsubmit="saveSettings(event)">
                <div class="form-group">
                    <label>Mission Statement</label>
                    <textarea id="settingsMission" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Vision Statement</label>
                    <textarea id="settingsVision" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Pillar: Revelation</label>
                    <textarea id="settingsRevelation" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Pillar: Manifestation</label>
                    <textarea id="settingsManifestation" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Pillar: Experience</label>
                    <textarea id="settingsExperience" rows="2" required></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Departments Modal -->
    <div id="departmentsModal" class="modal">
        <div class="modal-content" style="max-width:700px;">
            <div class="modal-header">
                <h2>Edit Departments</h2>
                <button class="close-modal" onclick="closeModal('departmentsModal')">&times;</button>
            </div>
            <div id="departmentsList">
                <div class="loading">Loading departments...</div>
            </div>
        </div>
    </div>

    <!-- Edit Department Modal -->
    <div id="editDeptModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="editDeptTitle">Edit Department</h2>
                <button class="close-modal" onclick="closeModal('editDeptModal')">&times;</button>
            </div>
            <form id="editDeptForm" onsubmit="saveDepartment(event)">
                <input type="hidden" id="editDeptId">
                <input type="hidden" id="editDeptKey">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="editDeptName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editDeptDescription" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Team Lead</label>
                    <input type="text" id="editDeptLead" required>
                </div>
                <div class="form-group">
                    <label>Lead Bio</label>
                    <textarea id="editDeptBio" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label>Display Order</label>
                    <input type="number" id="editDeptOrder" required>
                </div>
                <button type="submit" class="btn-primary" style="width:100%;">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        // ========== API Configuration ==========
        const API_BASE = '/api';

        // ========== Helper Functions ==========
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Close modals on outside click
        window.onclick = function(event) {
            document.querySelectorAll('.modal').forEach(modal => {
                if (event.target === modal) modal.style.display = 'none';
            });
        }

        // ========== Logout ==========
        function logout() {
            window.location.href = '/logout/';
        }

        // ========== Cloudinary Upload ==========
        async function uploadPoster() {
            const fileInput = document.getElementById('eventPosterFile');
            const file = fileInput.files[0];
            if (!file) {
                alert('Please select a file first');
                return;
            }

            const previewDiv = document.getElementById('posterPreview');
            previewDiv.innerHTML = '<div class="loading" style="padding:0.5rem;">Uploading...</div>';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/admin/upload/`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('eventPosterUrl').value = data.url;
                    previewDiv.innerHTML = `
                        <img src="${data.url}" class="preview-image" alt="Uploaded poster">
                        <p style="font-size:0.75rem;color:#94A3B8;margin-top:0.25rem;">Uploaded successfully</p>
                    `;
                } else {
                    previewDiv.innerHTML = `<p style="color:#ef4444;">Upload failed: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                console.error('Upload error:', error);
                previewDiv.innerHTML = `<p style="color:#ef4444;">Error uploading: ${error.message}</p>`;
            }
        }

        // ========== Load Events ==========
        async function loadEvents() {
            const container = document.getElementById('eventsList');
            try {
                const response = await fetch(`${API_BASE}/public/events/`);
                const events = await response.json();
                if (events.length === 0) {
                    container.innerHTML = '<div class="loading">No events yet.</div>';
                    return;
                }
                container.innerHTML = events.map(event => `
                    <div class="item-card">
                        <div class="item-info">
                            <h3>${escapeHtml(event.title)}</h3>
                            <p>${formatDate(event.date)} • 📍 ${escapeHtml(event.location)}</p>
                            ${event.poster_url ? `<p style="font-size:0.7rem;color:#C9A03D;">Poster uploaded</p>` : ''}
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" onclick="editEvent('${event.id}')"></button>
                            <button class="btn-delete" onclick="deleteEvent('${event.id}')"></button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load events:', error);
                container.innerHTML = '<div class="loading">Failed to load events</div>';
            }
        }

        // ========== Event CRUD ==========
        function openEventModal() {
            document.getElementById('eventModalTitle').textContent = 'Add Event';
            document.getElementById('eventId').value = '';
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventDescription').value = '';
            document.getElementById('eventPosterUrl').value = '';
            document.getElementById('eventPosterFile').value = '';
            document.getElementById('posterPreview').innerHTML = '';
            document.getElementById('eventModal').style.display = 'flex';
        }

        async function editEvent(eventId) {
            try {
                console.log('Loading event with ID:', eventId);
                const response = await fetch(`${API_BASE}/events/${eventId}/`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const event = await response.json();
                
                document.getElementById('eventModalTitle').textContent = 'Edit Event';
                document.getElementById('eventId').value = event.id;
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDate').value = event.date;
                document.getElementById('eventLocation').value = event.location;
                document.getElementById('eventDescription').value = event.description || '';
                document.getElementById('eventPosterUrl').value = event.poster_url || '';
                document.getElementById('eventPosterFile').value = '';
                
                if (event.poster_url) {
                    document.getElementById('posterPreview').innerHTML = `
                        <img src="${event.poster_url}" class="preview-image" alt="Current poster">
                        <p style="font-size:0.75rem;color:#94A3B8;margin-top:0.25rem;">Current poster</p>
                    `;
                } else {
                    document.getElementById('posterPreview').innerHTML = '';
                }
                
                document.getElementById('eventModal').style.display = 'flex';
            } catch (error) {
                console.error('Error loading event:', error);
                alert('Failed to load event: ' + error.message);
            }
        }

        async function saveEvent(e) {
            e.preventDefault();
            
            const eventId = document.getElementById('eventId').value;
            console.log('Event ID from hidden field:', eventId);
            
            const data = {
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                location: document.getElementById('eventLocation').value,
                description: document.getElementById('eventDescription').value,
                poster_url: document.getElementById('eventPosterUrl').value || null
            };
            
            console.log('Saving data:', data);
            
            try {
                let url, method;
                if (eventId && eventId !== '') {
                    url = `${API_BASE}/events/${eventId}/`;
                    method = 'PUT';
                } else {
                    url = `${API_BASE}/events/`;
                    method = 'POST';
                }
                
                console.log(`Sending ${method} request to:`, url);
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                console.log('Response:', result);
                
                if (response.ok) {
                    closeModal('eventModal');
                    loadEvents();
                    alert('Event saved successfully!');
                } else {
                    alert('Failed to save event: ' + (result.error || result.message || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error saving event:', error);
                alert('Error saving event: ' + error.message);
            }
        }

        async function deleteEvent(eventId) {
            if (confirm('Delete this event?')) {
                try {
                    const response = await fetch(`${API_BASE}/events/${eventId}/`, { 
                        method: 'DELETE',
                        headers: {
                            'X-CSRFToken': getCookie('csrftoken')
                        },
                        credentials: 'same-origin'
                    });
                    if (response.ok) {
                        loadEvents();
                        alert('Event deleted!');
                    } else {
                        alert('Failed to delete event');
                    }
                } catch (error) {
                    console.error('Error deleting event:', error);
                    alert('Error deleting event: ' + error.message);
                }
            }
        }

        // ========== Load Prayers ==========
        async function loadPrayers() {
            const container = document.getElementById('prayersList');
            try {
                const response = await fetch(`${API_BASE}/prayers/`);
                const prayers = await response.json();
                if (prayers.length === 0) {
                    container.innerHTML = '<div class="loading">No prayer requests yet.</div>';
                    return;
                }
                container.innerHTML = prayers.map(prayer => `
                    <div class="item-card">
                        <div class="item-info">
                            <h3>${escapeHtml(prayer.name)}</h3>
                            <p>${escapeHtml(prayer.request.substring(0, 80))}...</p>
                            <p style="font-size:0.75rem;color:#94A3B8;">${escapeHtml(prayer.category)} ${prayer.is_responded ? '✅ Responded' : '⏳ Pending'}</p>
                        </div>
                        <div class="item-actions">
                            ${!prayer.is_responded ? `<button class="btn-edit" onclick="markResponded('${prayer.id}')">✅</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load prayers:', error);
                container.innerHTML = '<div class="loading">Failed to load prayers</div>';
            }
        }

        async function markResponded(prayerId) {
            try {
                const response = await fetch(`${API_BASE}/prayers/${prayerId}/respond/`, { 
                    method: 'PUT',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'same-origin'
                });
                if (response.ok) {
                    loadPrayers();
                    alert('Prayer marked as responded!');
                } else {
                    alert('Failed to mark as responded');
                }
            } catch (error) {
                console.error('Error updating prayer:', error);
                alert('Error updating prayer: ' + error.message);
            }
        }

        // ========== Ministry Settings ==========
        async function openSettingsModal() {
            try {
                const response = await fetch(`${API_BASE}/admin/settings/`);
                const data = await response.json();
                document.getElementById('settingsMission').value = data.mission || '';
                document.getElementById('settingsVision').value = data.vision || '';
                document.getElementById('settingsRevelation').value = data.pillar_revelation || '';
                document.getElementById('settingsManifestation').value = data.pillar_manifestation || '';
                document.getElementById('settingsExperience').value = data.pillar_experience || '';
                document.getElementById('settingsModal').style.display = 'flex';
            } catch (error) {
                alert('Failed to load settings');
            }
        }

        async function saveSettings(e) {
            e.preventDefault();
            const data = {
                mission: document.getElementById('settingsMission').value,
                vision: document.getElementById('settingsVision').value,
                pillar_revelation: document.getElementById('settingsRevelation').value,
                pillar_manifestation: document.getElementById('settingsManifestation').value,
                pillar_experience: document.getElementById('settingsExperience').value
            };
            try {
                const response = await fetch(`${API_BASE}/admin/settings/`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    alert('Settings saved!');
                    closeModal('settingsModal');
                } else {
                    alert('Failed to save settings');
                }
            } catch (error) {
                alert('Error saving settings');
            }
        }

        // ========== Departments ==========
        async function openDepartmentsModal() {
            document.getElementById('departmentsModal').style.display = 'flex';
            await loadDepartmentsForEdit();
        }

        async function loadDepartmentsForEdit() {
            const container = document.getElementById('departmentsList');
            container.innerHTML = '<div class="loading">Loading departments...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/admin/content/`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const departments = await response.json();
                
                if (!departments || departments.length === 0) {
                    container.innerHTML = '<div class="loading">No departments found</div>';
                    return;
                }
                
                container.innerHTML = departments.map(dept => `
                    <div class="item-card">
                        <div class="item-info">
                            <h3>${escapeHtml(dept.name || dept.key)}</h3>
                            <p>Lead: ${escapeHtml(dept.team_lead || 'TBA')} • Order: ${dept.order || 0}</p>
                        </div>
                        <div class="item-actions">
                            <button class="btn-edit" onclick="openEditDeptModal('${dept.id}', '${dept.key}')">✏️ Edit</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load departments:', error);
                container.innerHTML = '<div class="loading">Failed to load departments</div>';
            }
        }

        async function openEditDeptModal(deptId, deptKey) {
            try {
                console.log('Fetching department:', deptId);
                const response = await fetch(`${API_BASE}/admin/content/${deptId}/`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const dept = await response.json();
                
                if (!dept || !dept.id) {
                    alert('Failed to load department data');
                    return;
                }
                
                document.getElementById('editDeptTitle').textContent = `Edit ${dept.name || deptKey}`;
                document.getElementById('editDeptId').value = dept.id;
                document.getElementById('editDeptKey').value = dept.key || deptKey;
                document.getElementById('editDeptName').value = dept.name || '';
                document.getElementById('editDeptDescription').value = dept.description || '';
                document.getElementById('editDeptLead').value = dept.team_lead || '';
                document.getElementById('editDeptBio').value = dept.lead_bio || '';
                document.getElementById('editDeptOrder').value = dept.order || 0;
                
                document.getElementById('editDeptModal').style.display = 'flex';
            } catch (error) {
                console.error('Failed to load department:', error);
                alert('Failed to load department: ' + error.message);
            }
        }

        async function saveDepartment(e) {
            e.preventDefault();
            const deptId = document.getElementById('editDeptId').value;
            const data = {
                name: document.getElementById('editDeptName').value,
                description: document.getElementById('editDeptDescription').value,
                team_lead: document.getElementById('editDeptLead').value,
                lead_bio: document.getElementById('editDeptBio').value,
                order: parseInt(document.getElementById('editDeptOrder').value)
            };
            try {
                const response = await fetch(`${API_BASE}/admin/content/${deptId}/`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken')
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify(data)
                });
                if (response.ok) {
                    alert('Department saved!');
                    closeModal('editDeptModal');
                    loadDepartmentsForEdit();
                } else {
                    alert('Failed to save department');
                }
            } catch (error) {
                alert('Error saving department');
            }
        }

        // ========== SESSION TIMEOUT WARNING ==========
        let sessionTimer;
        let warningTimer;
        let isWarningShown = false;
        const SESSION_TIMEOUT = 180; // 3 minutes in seconds
        const WARNING_TIME = 30; // Show warning 30 seconds before timeout

        function startSessionTimer() {
            let timeLeft = SESSION_TIMEOUT;

            clearInterval(sessionTimer);
            clearTimeout(warningTimer);
            isWarningShown = false;

            warningTimer = setTimeout(() => {
                showSessionWarning();
            }, (SESSION_TIMEOUT - WARNING_TIME) * 1000);

            sessionTimer = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) {
                    clearInterval(sessionTimer);
                    // Auto logout
                    logout();
                }
            }, 1000);
        }

        function showSessionWarning() {
            if (isWarningShown) return;
            isWarningShown = true;

            // Create warning modal
            const warningModal = document.createElement('div');
            warningModal.id = 'sessionWarningModal';
            warningModal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.85);
                backdrop-filter: blur(8px);
                z-index: 9999;
                display: flex;
                justify-content: center;
                align-items: center;
            `;

            warningModal.innerHTML = `
                <div style="
                    background: #1B2A4A;
                    border: 1px solid rgba(201,160,61,0.4);
                    border-radius: 24px;
                    padding: 2.5rem;
                    max-width: 500px;
                    width: 90%;
                    text-align: center;
                    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
                ">
                    <h2 style="color: #C9A03D; font-size: 1.5rem; margin-bottom: 1rem;">
                        ⏰ Session Expiring Soon
                    </h2>
                    <p style="color: #F4F6F9; margin-bottom: 1.5rem;">
                        You will be logged out in <strong id="countdownDisplay" style="color: #C9A03D;">30</strong> seconds due to inactivity.
                    </p>
                    <p style="color: #94A3B8; font-size: 0.9rem; margin-bottom: 1.5rem;">
                        Press any key or click anywhere to stay logged in.
                    </p>
                    <button onclick="resetSession()" style="
                        background: linear-gradient(135deg, #C9A03D, #A8842A);
                        color: #0A1128;
                        border: none;
                        padding: 0.7rem 2rem;
                        border-radius: 50px;
                        font-weight: 600;
                        cursor: pointer;
                        font-size: 1rem;
                        transition: all 0.3s;
                    ">Stay Logged In</button>
                </div>
            `;

            document.body.appendChild(warningModal);

            // Countdown inside warning
            let countdown = WARNING_TIME;
            const countdownEl = warningModal.querySelector('#countdownDisplay');
            const countdownInterval = setInterval(() => {
                countdown--;
                if (countdownEl) {
                    countdownEl.textContent = countdown;
                }
                if (countdown <= 0) {
                    clearInterval(countdownInterval);
                }
            }, 1000);

            // Listen for any user activity
            const resetSessionOnActivity = () => {
                resetSession();
                document.removeEventListener('keydown', resetSessionOnActivity);
                document.removeEventListener('click', resetSessionOnActivity);
                document.removeEventListener('mousemove', resetSessionOnActivity);
            };

            document.addEventListener('keydown', resetSessionOnActivity);
            document.addEventListener('click', resetSessionOnActivity);
            document.addEventListener('mousemove', resetSessionOnActivity);
        }

        function resetSession() {
            // Remove the warning modal
            const modal = document.getElementById('sessionWarningModal');
            if (modal) {
                modal.remove();
            }
            isWarningShown = false;

            // Reset the session timer
            startSessionTimer();

            // Send a keep-alive request to the server
            fetch('/api/auth/keep-alive/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                },
                credentials: 'same-origin'
            }).catch(err => console.log('Keep-alive failed:', err));
        }

        // ========== Initialize ==========
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Dashboard loaded!');
            loadEvents();
            loadPrayers();
            
            // Start session timer
            startSessionTimer();
            
            // Reset session timer on user activity
            document.addEventListener('click', function() {
                startSessionTimer();
            });
            document.addEventListener('keydown', function() {
                startSessionTimer();
            });
            document.addEventListener('mousemove', function() {
                startSessionTimer();
            });
        });
    </script>

</body>
</html>
